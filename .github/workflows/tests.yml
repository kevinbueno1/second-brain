name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r second-brain-tools/requirements-setup.lock.txt
      - run: python -m unittest discover -s second-brain-tools/tests -v
      - run: python second-brain-tools/brain.py reindex
      - run: python second-brain-tools/brain.py lint
